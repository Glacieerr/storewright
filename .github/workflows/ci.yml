# 持续集成：类型检查、单元与属性测试、Phase 1 结果可复现、多浏览器端到端测试（Chromium、WebKit、Firefox、不支持 SharedWorker 的浏览器、iPhone、安卓）
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 运行环境固定为 Ubuntu 24.04：ubuntu-latest 从 2026 年 10 月起逐步换成 26.04，字体和浏览器依赖会跟着变，升级时改这里

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Phase 1 comparison still runs
        run: npm run compare -- --template medium --reps 5 --seed 1 --profiles

  # 端到端测试按浏览器分成 4 个并行任务（一个任务跑完全部要将近 1 小时）：每个任务只装自己用的浏览器，项目名见 playwright.config.ts
  e2e:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    name: e2e (${{ matrix.group }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: chromium
            browsers: chromium
            projects: --project=live --project=demo --project=a11y
          - group: no-sharedworker-android
            browsers: chromium
            projects: --project=demo-no-sharedworker --project=android
          - group: webkit-iphone
            browsers: webkit
            projects: --project=live-webkit --project=demo-webkit --project=iphone
          - group: firefox
            browsers: firefox
            projects: --project=live-firefox --project=demo-firefox
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:all
      - run: npx playwright install --with-deps ${{ matrix.browsers }}
      - name: End-to-end tests (${{ matrix.group }})
        run: npx playwright test ${{ matrix.projects }}
        env:
          CI: 'true'
          PW_ALL: '1'
          PW_CHANNEL: ''
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-report-${{ matrix.group }}
          path: experiments/results/e2e-report
