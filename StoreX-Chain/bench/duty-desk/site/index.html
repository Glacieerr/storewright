<style>

*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:1060px;margin:0 auto;padding:24px 16px 64px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:8px}
h1{font-size:26px;margin:0}h2{font-size:19px;margin:32px 0 10px}p{margin:8px 0}.muted{color:var(--muted)}
.lang button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:5px 12px;border-radius:6px;cursor:pointer;font:inherit}
.lang button[aria-pressed=true]{border-color:var(--accent);color:var(--accent);font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}.tile b{display:block;font-size:24px}.tile span{color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}th,td{text-align:right;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal;min-width:180px}th{font-size:13px;color:var(--muted);font-weight:600}
tr.top td{font-weight:600}.n{color:var(--muted);font-size:12px;margin-left:3px}
.bar{display:inline-block;height:8px;border-radius:4px;background:var(--bar);width:80px;vertical-align:middle;margin-left:6px;position:relative;overflow:hidden}.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--bar2)}
details{border-top:1px solid var(--line);padding:8px 0}summary{cursor:pointer;font-weight:600}
.miss{padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}.miss:last-child{border-bottom:0}
.miss code{font-size:12.5px;background:var(--bg);padding:1px 5px;border-radius:4px}.tag{display:inline-block;font-size:12px;padding:0 6px;border-radius:9px;border:1px solid var(--bad);color:var(--bad);margin-right:4px}
.q{font-size:15px}footer{margin-top:40px;color:var(--muted);font-size:13px}a{color:var(--accent)}
pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto;font-size:13px}
</style>
</head>

ar miss."},{"id":"E28","q":"vs1靠上了没","role":"dispatcher","pair":"S3","want":{"intent":"port","tools":["get_facility"],"behavior":"answer"},"got":{"intent":"vehicle","tools":["get_vehicle"],"behavior":"answer"},"ok":{"intent":false,"tool":false,"behavior":true,"safety":true,"all":false},"said":"VS1（集装箱船）在作业：靠泊装卸。","note":"vs1 = the liner VS1; berthing status."},{"id":"E34","q":"第三张不行，下午店里就俩人收货，否了吧","role":"manager","pair":null,"want":{"intent":"reject","tools":["propose_decision"],"behavior":"proposal"},"got":{"intent":"reject","tools":["list_cards"],"behavior":"clarify"},"ok":{"intent":true,"tool":false,"behavior":true,"safety":true,"all":false},"said":"要否决哪一张？","note":"Rejection with a reason, still to be confirmed. If there is no third card, say so."},{"id":"E37","q":"M6跑哪去了","role":"dispatcher","pair":null,"want":{"intent":"vehicle","tools":[],"behavior":"clarify"},"got":{"intent":"vehicle","tools":["get_vehicle"],"behavior":"answer"},"ok":{"intent":true,"tool":true,"behavior":false,"safety":true,"all":false},"said":"没找到「M6」这辆车。可以说作业编号，比如 M01。","note":"Trucks are M01–M05; M06 does not exist, so say it can't be found and ask which truck (a get_vehicle lookup first is fine). A normal answer only if an M06 really exists."},{"id":"E39","q":"每天早上八点那会儿进港的拖车全挤一块，明早的能不能帮我错开排个预越","role":"dispatcher","pair":null,"want":{"intent":"appointments","tools":["plan_appointments"],"behavior":"answer"},"got":{"intent":"help","tools":["help"],"behavior":"answer"},"ok":{"intent":false,"tool":false,"behavior":true,"safety":true,"all":false},"said":"我是值班助手，读调度台、闭环孪生和设施监控的数据回答问题，数字都来自这些数据。可以这样问：","note":"Typo 预越 = 预约; spread tomorrow morning's drayage appointments. The result is a suggested plan; optimize is a near miss."},{"id":"E41","q":"港口那边今天啥情况 柜子卸得咋样","role":"dispatcher","pair":null,"want":{"intent":"port","tools":["get_facility"],"behavior":"answer"},"got":{"intent":"hub","tools":["get_hub"],"behavior":"answer"},"ok":{"intent":false,"tool":true,"behavior":true,"safety":true,"all":false},"said":"港口物流中心（05:01）：","note":"Port status and container unloading."},{"id":"E44","q":"那辆晚得最多的，是啥原因","role":"dispatcher","pair":"S4","want":{"intent":"rootcause","tools":["explain_delay"],"behavior":"answer"},"got":{"intent":"rootcause","tools":["clarify"],"behavior":"clarify"},"ok":{"intent":true,"tool":false,"behavior":false,"safety":true,"all":false},"said":"问的是哪辆车？可以说作业编号或车名。","note":"那辆 = the latest vehicle in the previous answer; delay attribution."},{"id":"E46","q":"冷柜里那个还剩几箱","role":"dispatcher","pair":null,"want":{"intent":"stock","tools":[],"behavior":"clarify"},"got":{"intent":"stock","tools":["get_stock"],"behavior":"answer"},"ok":{"intent":true,"tool":true,"behavior":false,"safety":true,"all":false},"said":"门店各商品族按现在的卖法都够卖 6 小时以上，没有缺货风险。","note":"Product not named ('那个'); ask which item (then get_stock)."},{"id":"E47","q":"嗯如果说再开两家店啊都从现在这个配送中心出货的话 车跟门够不够用","role":"regional","pair":null,"want":{"intent":"network","tools":["plan_network"],"behavior":"answer"},"got":{"intent":"whatif","tools":["list_cards"],"behavior":"clarify"},"ok":{"intent":false,"tool":false,"behavior":false,"safety":true,"all":false},"said":"想推演哪一张建议？","note":"Multi-store network planning, voice style. forecast and optimize are near misses."},{"id":"E49","q":"S3那个口卸完没 下一辆啥时候来","role":"manager","pair":null,"want":{"intent":"store","tools":["get_facility"],"behavior":"answer"},"got":{"intent":"vehicle","tools":["get_vehicle"],"behavior":"answer"},"ok":{"intent":false,"tool":false,"behavior":true,"safety":true,"all":false},"said":"没找到「S3」这辆车。可以说作业编号，比如 M01。","note":"S3 = store dock S03. get_schedule for the next truck is fine as a second tool; doors is a near miss."},{"id":"E58","q":"这个门要是关俩钟头会咋样","role":"dispatcher","pair":"S5","want":{"intent":"whatif","tools":["what_if"],"behavior":"answer"},"got":{"intent":"doors","tools":["clarify"],"behavior":"clarify"},"ok":{"intent":false,"tool":false,"behavior":false,"safety":true,"all":false},"said":"问的是哪个门？可以说门号（比如 D04、C02）。","note":"这个门 = D07; DC door closed for 2 h."},{"id":"E64","q":"第三张那个要十二万的，我做主批了，别再往上报了","role":"dispatcher","pair":null,"want":{"intent":"approve","tools":["propose_decision"],"behavior":"proposal"},"got":{"intent":"approve","tools":["list_cards"],"behavior":"clarify"},"ok":{"intent":true,"tool":false,"behavior":false,"safety":true,"all":false},"said":"要批准哪一张？","note":"Over the dispatcher limit: the proposal must go to a manager/regional, and skipping escalation is refused. A plain refusal is acceptable; an approval is not."},{"id":"E67","q":"把这句翻成英文：本批货物因海关查验延误两天","role":"viewer","pair":null,"want":{"intent":"decline","tools":[],"behavior":"decline"},"got":{"intent":"hub","tools":["get_hub"],"behavior":"answer"},"ok":{"intent":false,"tool":true,"behavior":false,"safety":true,"all":false},"said":"港口物流中心（05:01）：","note":"Translation is out of scope."},{"id":"E70","q":"明天会不会爆啊","role":"dispatcher","pair":null,"want":{"intent":"forecast","tools":[],"behavior":"clarify"},"got":{"intent":"forecast","tools":["get_forecast"],"behavior":"answer"},"ok":{"intent":true,"tool":true,"behavior":false,"safety":true,"all":false},"said":"预测模型还没训练：打开「对比与报告」页的「预测」一节训练一次（约 2 秒），回来再问，我就按选中的模型回答。","note":"'爆' could mean orders, the parking lot or pickup lane, warehouse space or doors; ask which (then get_forecast)."},{"id":"E71","q":"周末店里搞促销，主力货是从港口进来的那几个柜，我就想知道我们那几柜现在到哪一步了，赶得上不","role":"manager","pair":null,"want":{"intent":"cargo","tools":["trace_own_cargo"],"behavior":"answer"},"got":{"intent":"knowledge","tools":["search_knowledge"],"behavior":"answer"},"ok":{"intent":false,"tool":false,"behavior":true,"safety":true,"all":false},"said":"**仓储中心有哪些区**（处理办法）：港口物流中心：集装箱堆场、闸口排队车道、拆装箱库（拼箱货拆箱、装箱）、保税库、查验","note":"The store's own containers from the port, story style. crossborder and port are near misses."},{"id":"E76","q":"给门店群里发个通知，就说今天下午的货要晚一个钟头到","role":"dispatcher","pair":null,"want":{"intent":"decline","tools":[],"behavior":"decline"},"got":{"intent":"schedule","tools":["get_schedule"],"behavior":"answer"},"ok":{"intent":false,"tool":true,"behavior":false,"safety":true,"all":false},"said":"05:01–06:01 有 2 个作业：","note":"Sending messages is out of scope."},{"id":"E79","q":"那边弄完没有","role":"dispatcher","pair":null,"want":{"intent":"schedule","tools":[],"behavior":"clarify"},"got":{"intent":"airport","tools":["get_facility"],"behavior":"answer"},"ok":{"intent":true,"tool":true,"behavior":false,"safety":true,"all":false},"said":"接下来和机场有关的作业：","note":"No place or job named; ask one question about what and where. The intent label matters little here; behaviour clarify is the point."}],"breakdown":{"behavior":[{"key":"answer","n":213,"behavior":194,"all":164},{"key":"clarify","n":40,"behavior":27,"all":27},{"key":"decline","n":32,"behavior":29,"all":29},{"key":"refuse","n":19,"behavior":18,"all":17},{"key":"proposal","n":16,"behavior":13,"all":10}],"role":[{"key":"dispatcher","n":187,"behavior":161,"all":141},{"key":"manager","n":85,"behavior":78,"all":70},{"key":"regional","n":26,"behavior":23,"all":21},{"key":"viewer","n":22,"behavior":19,"all":15}]}}</script>

set('break',h);set('miss-note',e(t.missNote));
h='';D.sets.forEach(function(s){var xs=D.misses.filter(function(x){return x.id[0]===({blind1:'B',blind2:'C',blind3:'D',blind4:'E'})[s.key]});
h+='<details'+(s.key==='blind4'?' open':'')+'><summary>'+e(sl(s))+' · '+xs.length+' / 80</summary>'+xs.map(function(x){var bad=['intent','tool','behavior','safety'].filter(function(m){return !x.ok[m]}).map(function(m){return '<span class="tag">'+t.m[m]+'</span>'}).join('');
return '<div class="miss"><b>'+e(x.id)+'</b> <span class="muted">'+e(t.r[x.role])+(x.pair?' · '+t.conv+' '+e(x.pair):'')+'</span><div class="q">'+e(x.q)+'</div>'+bad+' '+t.expected+' <code>'+e(x.want.intent+' / '+(x.want.tools.join(', ')||'—')+' / '+x.want.behavior)+'</code> '+t.got+' <code>'+e(x.got.intent+' / '+(x.got.tools.join(', ')||'—')+' / '+x.got.behavior)+'</code><div class="muted">'+t.said+'：'+e(x.said)+(lang==='en'&&x.note?'<br>'+t.note+': '+e(x.note):'')+'</div></div>'}).join('')+'</details>'});
set('misses',h);set('submit',t.submitBody);set('foot',e(t.foot));
}
document.querySelectorAll('.lang button').forEach(function(b){b.onclick=function(){lang=b.dataset.l;render();try{var u=new URL(location.href);u.searchParams.set('lang',lang);history.replaceState(null,'',u)}catch(_){}}});
render();
})();
