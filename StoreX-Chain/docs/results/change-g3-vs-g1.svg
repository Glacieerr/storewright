<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 476" width="720" height="476" role="img" aria-label="StoreX 全链路相对上一代的变化" class="viz"><style>
  .viz{--bg:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#6250d6;--good:#2a78d6;--bad:#e34948;--neutral:#f0efec}
  @media (prefers-color-scheme: dark){.viz{--bg:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#9085e9;--good:#3987e5;--bad:#e66767;--neutral:#383835}}
  text{font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:var(--ink2);font-size:12px}
  .t{fill:var(--ink);font-size:15px;font-weight:600}
  .st{fill:var(--ink2);font-size:12px}
  .ax{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
  .v{fill:var(--ink);font-size:11px;font-variant-numeric:tabular-nums}
  .lab{fill:var(--ink);font-size:12px}
  .grid{stroke:var(--grid);stroke-width:1}
  .base{stroke:var(--axis);stroke-width:1}
</style><rect width="720" height="476" rx="8" fill="var(--bg)"/><text x="20" y="28" class="t">StoreX 全链路相对上一代的变化</text><text x="20" y="48" class="st">20 个种子的配对差值 ÷ 上一代的均值；灰色 = 差异不显著</text><line x1="320" x2="320" y1="66" y2="450" class="grid"/><text x="320" y="466" text-anchor="middle" class="ax">−100%</text><line x1="390" x2="390" y1="66" y2="450" class="grid"/><text x="390" y="466" text-anchor="middle" class="ax">−50%</text><line x1="460" x2="460" y1="66" y2="450" class="base"/><text x="460" y="466" text-anchor="middle" class="ax">0%</text><line x1="530" x2="530" y1="66" y2="450" class="grid"/><text x="530" y="466" text-anchor="middle" class="ax">+50%</text><line x1="600" x2="600" y1="66" y2="450" class="grid"/><text x="600" y="466" text-anchor="middle" class="ax">+100%</text><text x="310" y="84" text-anchor="end" class="lab">门店服务水平（需求满足）</text><rect x="460" y="74" width="1" height="13" rx="3" fill="var(--good)"/><text x="466.73076114085336" y="85" class="v">+1% 改善</text><text x="310" y="106" text-anchor="end" class="lab">门店库存</text><rect x="440.58389785120596" y="96" width="19.41610214879404" height="13" rx="3" fill="var(--good)"/><text x="466" y="107" class="v">−14% 改善</text><text x="310" y="128" text-anchor="end" class="lab">门店生鲜损耗（报废 / 到货）</text><rect x="375.4445768871198" y="118" width="84.55542311288019" height="13" rx="3" fill="var(--good)"/><text x="466" y="129" class="v">−60% 改善</text><text x="310" y="150" text-anchor="end" class="lab">生鲜到店时剩余的保质期</text><rect x="460" y="140" width="37.526695868172624" height="13" rx="3" fill="var(--good)"/><text x="503.5266958681726" y="151" class="v">+27% 改善</text><text x="310" y="172" text-anchor="end" class="lab">到店卸货的车次（配送车、面包车、长途直送）</text><rect x="430.0729120636324" y="162" width="29.927087936367627" height="13" rx="3" fill="var(--good)"/><text x="466" y="173" class="v">−21% 改善</text><text x="310" y="194" text-anchor="end" class="lab">配送中心库存</text><rect x="356.4763126014246" y="184" width="103.52368739857542" height="13" rx="3" fill="var(--good)"/><text x="466" y="195" class="v">−74% 改善</text><text x="310" y="216" text-anchor="end" class="lab">配送中心工时</text><rect x="381.3266836138789" y="206" width="78.67331638612109" height="13" rx="3" fill="var(--good)"/><text x="466" y="217" class="v">−56% 改善</text><text x="310" y="238" text-anchor="end" class="lab">配送里程（含面包车）</text><rect x="387.9098224010607" y="228" width="72.0901775989393" height="13" rx="3" fill="var(--good)"/><text x="466" y="239" class="v">−51% 改善</text><text x="310" y="260" text-anchor="end" class="lab">配送车装载率</text><rect x="460" y="250" width="4.40547893364743" height="13" rx="3" fill="var(--good)"/><text x="470.40547893364743" y="261" class="v">+3% 改善</text><text x="310" y="282" text-anchor="end" class="lab">配送车队（最多同时用车）</text><rect x="352.30769230769226" y="272" width="107.69230769230774" height="13" rx="3" fill="var(--good)"/><text x="466" y="283" class="v">−77% 改善</text><text x="310" y="304" text-anchor="end" class="lab">进货里程（长途整车 + 区域生鲜 + 机场）</text><rect x="436.4832149289106" y="294" width="23.516785071089373" height="13" rx="3" fill="var(--good)"/><text x="466" y="305" class="v">−17% 改善</text><text x="310" y="326" text-anchor="end" class="lab">集装箱在港口堆场停留</text><rect x="369.2357221814858" y="316" width="90.76427781851419" height="13" rx="3" fill="var(--good)"/><text x="466" y="327" class="v">−65% 改善</text><text x="310" y="348" text-anchor="end" class="lab">本地运输排放（配送、进货、港口）</text><rect x="435.83067296848185" y="338" width="24.16932703151815" height="13" rx="3" fill="var(--good)"/><text x="466" y="349" class="v">−17% 改善</text><text x="310" y="370" text-anchor="end" class="lab">运输成本（配送 + 面包车 + 进货 + 港口拖车和铁路）</text><rect x="411.995298854422" y="360" width="48.004701145578" height="13" rx="3" fill="var(--good)"/><text x="466" y="371" class="v">−34% 改善</text><text x="310" y="392" text-anchor="end" class="lab">供应链成本合计</text><rect x="382.94408844378444" y="382" width="77.05591155621556" height="13" rx="3" fill="var(--good)"/><text x="466" y="393" class="v">−55% 改善</text><text x="310" y="414" text-anchor="end" class="lab">库存资金（门店 + 配送中心）</text><rect x="372.84283515791014" y="404" width="87.15716484208986" height="13" rx="3" fill="var(--good)"/><text x="466" y="415" class="v">−62% 改善</text><text x="310" y="436" text-anchor="end" class="lab">全系统运营成本（供应链 + 门店人工能耗）</text><rect x="396.28005255837365" y="426" width="63.719947441626346" height="13" rx="3" fill="var(--good)"/><text x="466" y="437" class="v">−46% 改善</text></svg>
