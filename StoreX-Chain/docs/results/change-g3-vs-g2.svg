<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 476" width="720" height="476" role="img" aria-label="StoreX 全链路相对 StoreX 的变化" class="viz"><style>
  .viz{--bg:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#6250d6;--good:#2a78d6;--bad:#e34948;--neutral:#f0efec}
  @media (prefers-color-scheme: dark){.viz{--bg:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#9085e9;--good:#3987e5;--bad:#e66767;--neutral:#383835}}
  text{font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:var(--ink2);font-size:12px}
  .t{fill:var(--ink);font-size:15px;font-weight:600}
  .st{fill:var(--ink2);font-size:12px}
  .ax{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
  .v{fill:var(--ink);font-size:11px;font-variant-numeric:tabular-nums}
  .lab{fill:var(--ink);font-size:12px}
  .grid{stroke:var(--grid);stroke-width:1}
  .base{stroke:var(--axis);stroke-width:1}
</style><rect width="720" height="476" rx="8" fill="var(--bg)"/><text x="20" y="28" class="t">StoreX 全链路相对 StoreX 的变化</text><text x="20" y="48" class="st">20 个种子的配对差值 ÷  StoreX 的均值；灰色 = 差异不显著</text><line x1="320" x2="320" y1="66" y2="450" class="grid"/><text x="320" y="466" text-anchor="middle" class="ax">−75%</text><line x1="366.6666666666667" x2="366.6666666666667" y1="66" y2="450" class="grid"/><text x="366.6666666666667" y="466" text-anchor="middle" class="ax">−50%</text><line x1="413.3333333333333" x2="413.3333333333333" y1="66" y2="450" class="grid"/><text x="413.3333333333333" y="466" text-anchor="middle" class="ax">−25%</text><line x1="460" x2="460" y1="66" y2="450" class="base"/><text x="460" y="466" text-anchor="middle" class="ax">0%</text><line x1="506.66666666666663" x2="506.66666666666663" y1="66" y2="450" class="grid"/><text x="506.66666666666663" y="466" text-anchor="middle" class="ax">+25%</text><line x1="553.3333333333334" x2="553.3333333333334" y1="66" y2="450" class="grid"/><text x="553.3333333333334" y="466" text-anchor="middle" class="ax">+50%</text><line x1="600" x2="600" y1="66" y2="450" class="grid"/><text x="600" y="466" text-anchor="middle" class="ax">+75%</text><text x="310" y="84" text-anchor="end" class="lab">门店服务水平（需求满足）</text><rect x="460" y="74" width="1" height="13" rx="3" fill="var(--muted)"/><text x="466.16997282850195" y="85" class="v">+0%</text><text x="310" y="106" text-anchor="end" class="lab">门店库存</text><rect x="448.7312381369205" y="96" width="11.268761863079476" height="13" rx="3" fill="var(--good)"/><text x="466" y="107" class="v">−6% 改善</text><text x="310" y="128" text-anchor="end" class="lab">门店生鲜损耗（报废 / 到货）</text><rect x="426.0854760869046" y="118" width="33.91452391309542" height="13" rx="3" fill="var(--good)"/><text x="466" y="129" class="v">−18% 改善</text><text x="310" y="150" text-anchor="end" class="lab">生鲜到店时剩余的保质期</text><rect x="460" y="140" width="33.6993470632205" height="13" rx="3" fill="var(--good)"/><text x="499.6993470632205" y="151" class="v">+18% 改善</text><text x="310" y="172" text-anchor="end" class="lab">到店卸货的车次（配送车、面包车、长途直送）</text><rect x="418.98695318495777" y="162" width="41.01304681504223" height="13" rx="3" fill="var(--good)"/><text x="466" y="173" class="v">−22% 改善</text><text x="310" y="194" text-anchor="end" class="lab">配送中心库存</text><rect x="327.6851056457058" y="184" width="132.3148943542942" height="13" rx="3" fill="var(--good)"/><text x="466" y="195" class="v">−71% 改善</text><text x="310" y="216" text-anchor="end" class="lab">配送中心工时</text><rect x="355.1304742734463" y="206" width="104.86952572655372" height="13" rx="3" fill="var(--good)"/><text x="466" y="217" class="v">−56% 改善</text><text x="310" y="238" text-anchor="end" class="lab">配送里程（含面包车）</text><rect x="363.12100763444874" y="228" width="96.87899236555126" height="13" rx="3" fill="var(--good)"/><text x="466" y="239" class="v">−52% 改善</text><text x="310" y="260" text-anchor="end" class="lab">配送车装载率</text><rect x="460" y="250" width="6.3668471224308405" height="13" rx="3" fill="var(--good)"/><text x="472.36684712243084" y="261" class="v">+3% 改善</text><text x="310" y="282" text-anchor="end" class="lab">配送车队（最多同时用车）</text><rect x="325.9154929577465" y="272" width="134.0845070422535" height="13" rx="3" fill="var(--good)"/><text x="466" y="283" class="v">−72% 改善</text><text x="310" y="304" text-anchor="end" class="lab">进货里程（长途整车 + 区域生鲜 + 机场）</text><rect x="430.65048166074894" y="294" width="29.349518339251063" height="13" rx="3" fill="var(--good)"/><text x="466" y="305" class="v">−16% 改善</text><text x="310" y="326" text-anchor="end" class="lab">集装箱在港口堆场停留</text><rect x="338.79822759543896" y="316" width="121.20177240456104" height="13" rx="3" fill="var(--good)"/><text x="466" y="327" class="v">−65% 改善</text><text x="310" y="348" text-anchor="end" class="lab">本地运输排放（配送、进货、港口）</text><rect x="429.7382035221341" y="338" width="30.261796477865914" height="13" rx="3" fill="var(--good)"/><text x="466" y="349" class="v">−16% 改善</text><text x="310" y="370" text-anchor="end" class="lab">运输成本（配送 + 面包车 + 进货 + 港口拖车和铁路）</text><rect x="403.17691283100135" y="360" width="56.823087168998654" height="13" rx="3" fill="var(--good)"/><text x="466" y="371" class="v">−30% 改善</text><text x="310" y="392" text-anchor="end" class="lab">供应链成本合计</text><rect x="389.1223215117128" y="382" width="70.87767848828719" height="13" rx="3" fill="var(--good)"/><text x="466" y="393" class="v">−38% 改善</text><text x="310" y="414" text-anchor="end" class="lab">库存资金（门店 + 配送中心）</text><rect x="351.26309778257576" y="404" width="108.73690221742424" height="13" rx="3" fill="var(--good)"/><text x="466" y="415" class="v">−58% 改善</text><text x="310" y="436" text-anchor="end" class="lab">全系统运营成本（供应链 + 门店人工能耗）</text><rect x="424.376714128514" y="426" width="35.62328587148602" height="13" rx="3" fill="var(--good)"/><text x="466" y="437" class="v">−19% 改善</text></svg>
