ill="var(--good)"/><text x="402" y="195" class="v">−53% 改善</text><text x="182" y="216" text-anchor="end" class="lab">到店顾客结账平均等待</text><rect x="305.59053184352524" y="206" width="90.40946815647476" height="13" rx="3" fill="var(--good)"/><text x="402" y="217" class="v">−44% 改善</text><text x="182" y="238" text-anchor="end" class="lab">货架缺货率（营业时间平均）</text><rect x="233.0618286658132" y="228" width="162.9381713341868" height="13" rx="3" fill="var(--good)"/><text x="402" y="239" class="v">−80% 改善</text><text x="182" y="260" text-anchor="end" class="lab">因缺货流失的销售额</text><rect x="212.92872543613785" y="250" width="183.07127456386215" height="13" rx="3" fill="var(--good)"/><text x="402" y="261" class="v">−90% 改善</text><text x="182" y="282" text-anchor="end" class="lab">全店带薪工时</text><rect x="306.57294397393105" y="272" width="89.42705602606895" height="13" rx="3" fill="var(--good)"/><text x="402" y="283" class="v">−44% 改善</text><text x="182" y="304" text-anchor="end" class="lab">生鲜损耗（报废 / 进货）</text><rect x="292.28507359973963" y="294" width="103.71492640026037" height="13" rx="3" fill="var(--good)"/><text x="402" y="305" class="v">−51% 改善</text><text x="182" y="326" text-anchor="end" class="lab">电网购电</text><rect x="296.42820724559795" y="316" width="99.57179275440205" height="13" rx="3" fill="var(--good)"/><text x="402" y="327" class="v">−49% 改善</text><text x="182" y="348" text-anchor="end" class="lab">购电碳排放</text><rect x="296.42820724559795" y="338" width="99.57179275440205" height="13" rx="3" fill="var(--good)"/><text x="402" y="349" class="v">−49% 改善</text><text x="182" y="370" text-anchor="end" class="lab">货车卸货停留</text><rect x="330.44334121699023" y="360" width="65.55665878300977" height="13" rx="3" fill="var(--good)"/><text x="402" y="371" class="v">−32% 改善</text><text x="182" y="392" text-anchor="end" class="lab">以上合计</text><rect x="305.0089416068057" y="382" width="90.9910583931943" height="13" rx="3" fill="var(--good)"/><text x="402" y="393" class="v">−45% 改善</text></s